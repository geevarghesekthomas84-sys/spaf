name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps-and-fs:
    name: Dependency & filesystem scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # report only; don't fail the build on advisories yet

  image:
    name: Build & scan API image (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/Dockerfile -t spaf-api:scan .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: spaf-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  supply-chain:
    name: Dependency audit + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp]" pip-audit cyclonedx-bom
      - name: Audit dependencies for known CVEs (report-only)
        run: pip-audit --progress-spinner off || true
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format json --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: spaf-sbom
          path: sbom.json
