<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-label="SPAF — Smart Pentesting Automation Framework">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1116"/>
      <stop offset="0.55" stop-color="#0a0e12"/>
      <stop offset="1" stop-color="#070a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#E0A82E" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#E0A82E" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#E0A82E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6CE63"/>
      <stop offset="0.5" stop-color="#E0A82E"/>
      <stop offset="1" stop-color="#C98B1C"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0A82E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0A82E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E0A82E" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono','DejaVu Sans Mono','SFMono-Regular',Consolas,monospace; }
      .wm   { font-family: 'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace; font-weight: 800; }
      .cursor { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
      .scan { animation: sweep 7s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateY(-20px); opacity: 0 }
        12% { opacity: .55 } 50% { opacity: .2 } 88% { opacity: .55 }
        100% { transform: translateY(330px); opacity: 0 } }
      .fade { animation: fin 1.1s ease-out both; }
      @keyframes fin { from { opacity: 0 } to { opacity: 1 } }
    </style>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="1184" height="344" rx="18" fill="url(#bg)" stroke="#1c2630"/>
  <rect x="8" y="8" width="1184" height="344" rx="18" fill="url(#glow)"/>

  <!-- faint column grid -->
  <g stroke="#15202a" stroke-width="1" opacity="0.6">
    <line x1="300" y1="24" x2="300" y2="336"/>
    <line x1="600" y1="24" x2="600" y2="336"/>
    <line x1="900" y1="24" x2="900" y2="336"/>
  </g>

  <!-- animated scan line -->
  <g class="scan"><rect x="20" y="24" width="1160" height="2" fill="url(#rule)"/></g>

  <!-- window chrome -->
  <g class="fade">
    <circle cx="44" cy="40" r="6" fill="#E5484D"/>
    <circle cx="66" cy="40" r="6" fill="#E0A82E"/>
    <circle cx="88" cy="40" r="6" fill="#35C08A"/>
    <text x="120" y="45" class="mono" font-size="14" fill="#5B6672">spaf — ~/engagement · authorized testing only</text>
  </g>
  <line x1="20" y1="62" x2="1180" y2="62" stroke="#17212b" stroke-width="1"/>

  <!-- wordmark -->
  <g class="fade">
    <text x="600" y="190" text-anchor="middle" class="wm" font-size="128"
          letter-spacing="10" fill="url(#amber)" filter="url(#soft)">SPAF</text>
    <text x="600" y="232" text-anchor="middle" class="mono" font-size="19"
          letter-spacing="7" fill="#9AA6B2">SMART · PENTESTING · AUTOMATION · FRAMEWORK</text>
  </g>

  <!-- center rule -->
  <rect x="430" y="256" width="340" height="2" fill="url(#rule)"/>

  <!-- prompt line -->
  <g class="fade">
    <text x="600" y="300" text-anchor="middle" class="mono" font-size="20" fill="#C6D0DA">
      <tspan fill="#E0A82E">❯</tspan>  spaf agent target.com  <tspan fill="#5B6672">→</tspan>  <tspan fill="#9AA6B2">AI plans · runs · reports</tspan><tspan class="cursor" fill="#E0A82E">▌</tspan>
    </text>
  </g>

  <!-- capability footer -->
  <text x="600" y="334" text-anchor="middle" class="mono" font-size="13" fill="#49535e">
    CLI · HTTP API · MCP · dashboard · metrics · Docker+Caddy · multi-engagement RBAC
  </text>
</svg>
