[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spaf"
version = "1.12.0"
description = "Smart Pentesting Automation Framework — AI-augmented offensive security automation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "geevarghese" }]
keywords = [
    "security", "pentesting", "offensive-security", "recon",
    "reconnaissance", "bug-bounty", "vulnerability-scanner", "nuclei",
    "automation", "red-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "aiohttp>=3.8.0",
    "motor>=3.3.0",
    "dnspython>=2.4.0",
    "python-whois>=0.8.0",
    "pymongo>=4.5.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# HTTP API: REST + WebSocket over the service layer.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
# MCP server: expose SPAF as tools for Claude Desktop / MCP hosts.
mcp = ["mcp>=1.2"]
# AI providers and passive-intel integrations (imported lazily / guarded).
ai = [
    "google-genai>=1.0.0",
    "anthropic>=0.10.0",
    "openai>=1.0.0",
]
intel = ["shodan>=1.28.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["spaf*"]

[tool.setuptools.package-data]
"spaf.api" = ["static/*.html"]

[project.urls]
Homepage = "https://github.com/geevarghesekthomas84-sys/spaf"
Repository = "https://github.com/geevarghesekthomas84-sys/spaf"
Issues = "https://github.com/geevarghesekthomas84-sys/spaf/issues"
Changelog = "https://github.com/geevarghesekthomas84-sys/spaf/blob/main/CHANGELOG.md"

[project.scripts]
spaf = "spaf.cli.main:entry_point"

[tool.ruff]
line-length = 120
target-version = "py311"

# Lint for real defects (pyflakes + critical pycodestyle), not cosmetic style,
# so the codebase's deliberate column alignment is left untouched.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Ignore stylistic rules the codebase uses deliberately; keep real-bug rules on.
ignore = [
    "E741",  # ambiguous short names (l, z)
    "E401",  # multiple imports on one line
    "E402",  # module import not at top (load_dotenv must run first in main.py)
    "E701",  # multiple statements on one line (colon) — used for terse guards
    "E702",  # multiple statements on one line (semicolon)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.pytest.ini_options]
testpaths = ["tests"]
