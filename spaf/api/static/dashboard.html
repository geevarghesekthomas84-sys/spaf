<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPAF · console</title>
<style>
  :root{
    --bg:#0b0f0c; --panel:#11161a; --line:#222b24; --ink:#d8dee2;
    --steel:#9AA0A6; --faint:#5C6370; --amber:#E0A82E; --ok:#30A46C; --danger:#E5484D;
    --crit:#E5484D; --high:#F0883E; --med:#E0A82E; --low:#3FA7E0; --info:#6B7280;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
  a{color:var(--amber)}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .mark{color:var(--amber);font-weight:700;letter-spacing:.5px}
  .dot{color:var(--faint)}
  header .grow{flex:1}
  input,select,button{background:#0d1210;color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:7px 10px;font:inherit}
  input::placeholder{color:var(--faint)}
  button{cursor:pointer;border-color:#3a4a33}
  button.primary{background:#1a1403;border-color:var(--amber);color:var(--amber)}
  button:hover{border-color:var(--amber)}
  main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .panel h2{margin:0 0 10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--steel)}
  .row{display:flex;gap:8px;margin:8px 0}
  .row>*{flex:1}
  label{display:flex;align-items:center;gap:6px;color:var(--steel);font-size:13px}
  .kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
  .kv span:last-child{color:var(--steel)}
  pre.log{background:#0a0e0b;border:1px solid var(--line);border-radius:8px;padding:10px;
    height:190px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word;font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--steel);font-weight:600}
  .sev{font-weight:700}
  .c-Critical{color:var(--crit)}.c-High{color:var(--high)}.c-Medium{color:var(--med)}
  .c-Low{color:var(--low)}.c-Info{color:var(--info)}
  .pill{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:20px;color:var(--steel);font-size:12px}
  .muted{color:var(--faint)}
</style>
</head>
<body>
<header>
  <span class="mark">◇ SPAF</span><span class="dot">·</span>
  <span class="muted">console</span><span class="dot">·</span>
  <span id="ver" class="muted">v…</span>
  <span class="grow"></span>
  <input id="key" type="password" placeholder="X-API-Key" style="width:220px" />
  <button id="save">connect</button>
  <span id="auth" class="pill">no key</span>
</header>

<main>
  <section class="panel" style="align-self:start">
    <h2>Status</h2>
    <div id="status"><div class="muted">enter your API key and connect.</div></div>

    <h2 style="margin-top:16px">Run</h2>
    <div class="row"><select id="module">
      <option value="recon">recon</option>
      <option value="toolkit">toolkit</option>
      <option value="scan">scan (network)</option>
      <option value="webscan">webscan</option>
      <option value="crawl">crawl</option>
      <option value="agent">agent</option>
    </select></div>
    <div class="row"><input id="target" placeholder="target (in-scope)"></div>
    <label id="dryWrap"><input type="checkbox" id="dry" checked> agent: plan only (dry-run)</label>
    <div class="row"><button class="primary" id="go">start</button>
      <button id="addScope">add target to scope</button></div>
    <div id="jobline" class="muted" style="margin-top:8px"></div>
  </section>

  <section>
    <div class="panel">
      <h2>Live</h2>
      <pre class="log" id="log">—</pre>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>Findings</h2>
      <table><thead><tr><th>Severity</th><th>Type</th><th>Target</th><th>Detail</th></tr></thead>
      <tbody id="findings"><tr><td colspan="4" class="muted">no run yet.</td></tr></tbody></table>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>Audit (recent active actions)</h2>
      <table><thead><tr><th>Time</th><th>Surface</th><th>Action</th><th>Target</th><th>Scope</th></tr></thead>
      <tbody id="audit"><tr><td colspan="5" class="muted">—</td></tr></tbody></table>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let KEY = localStorage.getItem("spaf_key") || "";
$("#key").value = KEY;

function hdr(){ return KEY ? {"X-API-Key":KEY} : {}; }
async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{...hdr(), "content-type":"application/json", ...(opts.headers||{})}});
  if(r.status===401){ setAuth(false); throw new Error("401 unauthorized"); }
  return r;
}
function setAuth(ok){ $("#auth").textContent = ok?"connected":"no key"; $("#auth").style.color = ok?"var(--ok)":"var(--faint)"; $("#auth").style.borderColor = ok?"var(--ok)":"var(--line)"; }

async function refresh(){
  try{
    const v = await (await fetch("/version")).json(); $("#ver").textContent = "v"+v.version;
    const [scope, tools] = await Promise.all([api("/scope"), api("/tools")]);
    const s = await scope.json(), t = (await tools.json()).tools;
    const inst = t.filter(x=>x.installed).length;
    $("#status").innerHTML =
      `<div class="kv"><span>scope</span><span>${s.enforced? s.in_scope.length+" in-scope":"not enforced"}</span></div>`+
      `<div class="kv"><span>tools installed</span><span>${inst}/${t.length}</span></div>`+
      `<div class="kv"><span>db / mongo</span><span>—</span></div>`;
    setAuth(true);
    loadAudit();
  }catch(e){ /* not connected */ }
}
async function loadAudit(){
  try{
    const a = (await (await api("/audit?limit=25")).json()).entries;
    $("#audit").innerHTML = a.length ? a.map(e=>
      `<tr><td class="muted">${(e.ts||"").replace("T"," ").slice(0,19)}</td><td>${e.surface||""}</td>`+
      `<td>${e.action||""}</td><td>${e.target||""}</td>`+
      `<td>${e.scope_ok===false?'<span class="c-Critical">denied</span>':'<span class="c-Low">ok</span>'}</td></tr>`
    ).join("") : `<tr><td colspan="5" class="muted">no audit entries yet.</td></tr>`;
  }catch(e){}
}

function renderFindings(list){
  $("#findings").innerHTML = (list&&list.length) ? list.map(f=>
    `<tr><td class="sev c-${f.severity}">${f.severity}</td><td>${esc(f.type||f.vuln_type)}</td>`+
    `<td class="muted">${esc(f.target)}</td><td>${esc(f.detail||"")}</td></tr>`).join("")
    : `<tr><td colspan="4" class="muted">no findings.</td></tr>`;
}
function esc(s){ return (s==null?"":String(s)).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }
function logln(t){ const el=$("#log"); if(el.textContent==="—")el.textContent=""; el.textContent += t+"\n"; el.scrollTop=el.scrollHeight; }

$("#save").onclick = ()=>{ KEY=$("#key").value.trim(); localStorage.setItem("spaf_key",KEY); refresh(); };
$("#module").onchange = ()=>{ $("#dryWrap").style.display = $("#module").value==="agent"?"flex":"none"; };
$("#module").onchange();

$("#addScope").onclick = async ()=>{
  const t=$("#target").value.trim(); if(!t)return;
  try{ await api("/scope",{method:"POST",body:JSON.stringify({value:t})}); logln("+ scope: "+t); refresh(); }
  catch(e){ logln("! "+e.message); }
};

$("#go").onclick = async ()=>{
  const module=$("#module").value, target=$("#target").value.trim();
  if(!target){ logln("! enter a target"); return; }
  $("#log").textContent="—"; renderFindings([]);
  try{
    let job;
    if(module==="agent"){
      const r = await api("/agent",{method:"POST",body:JSON.stringify({target,dry_run:$("#dry").checked})});
      job = await r.json();
    }else{
      const r = await api("/scans",{method:"POST",body:JSON.stringify({module,target})});
      if(r.status===403){ logln("! out of engagement scope — add it first"); return; }
      job = await r.json();
    }
    $("#jobline").textContent = "job "+job.job_id+" · "+job.status;
    streamJob(job.job_id);
  }catch(e){ logln("! "+e.message); }
};

function streamJob(id){
  const proto = location.protocol==="https:"?"wss":"ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/jobs/${id}?api_key=${encodeURIComponent(KEY)}`);
  ws.onmessage = ev=>{
    const m = JSON.parse(ev.data);
    if(m.kind==="done"){ logln("· done ("+m.status+")"); finishJob(id); ws.close(); return; }
    if(m.kind==="finding"){ logln("  + "+m.message+" ["+((m.data||{}).severity||"")+"]"); }
    else logln("· "+m.kind+(m.module?(" "+m.module):""));
  };
  ws.onerror = ()=> logln("! ws error");
}
async function finishJob(id){
  try{
    const j = await (await api("/jobs/"+id)).json();
    const res = j.result||{};
    renderFindings(res.findings||[]);
    if(res.plan){ logln("plan: "+res.plan.map(s=>s.module).join(" → ")); }
    if(res.assessment){ logln("\n== assessment ==\n"+res.assessment); }
    loadAudit();
  }catch(e){ logln("! "+e.message); }
}

refresh();
</script>
</body>
</html>
